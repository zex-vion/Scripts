<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a Blue Lock Squad - Script</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            background: #181b23;
            border-radius: 16px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aeb4c0;
        }

        .code {
            margin-top: 25px;
            padding: 18px;
            background: #0d0f14;
            border-radius: 10px;
            text-align: left;
            word-break: break-all;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .status {
            margin-top: 12px;
            color: #7ee787;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Build a Blue Lock Squad</h1>

        <p>Your script is ready.</p>

        <div class="code" id="loadstring">
            loadstring(game:HttpGet("https://raw.githubusercontent.com/zex-vion/Scripts/main/BuildaBlueLockSquad"))()
        </div>

        <button onclick="copyLoadstring()">
            Copy Loadstring
        </button>

        <div class="status" id="status">
            ✓ Loadstring copied!
        </div>
    </div>

    <script>
        function copyLoadstring() {
            const text = document.getElementById("loadstring").innerText;

            navigator.clipboard.writeText(text).then(() => {
                document.getElementById("status").style.display = "block";

                setTimeout(() => {
                    document.getElementById("status").style.display = "none";
                }, 2000);
            });
        }
    </script>

</body>
</html>
